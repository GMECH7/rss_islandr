<!DOCTYPE html>
<html>
<head>
    <title>Geology, Mines, and Hydrogeological Map Layers</title>
    <link rel="preload" as="image" href="geology_legend.png">
    <link rel="preload" as="image" href="hydro_legend.png">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        #map { width: 100%; height: 900px; }
        #info { padding: 5px; }
        .legend {
            position: absolute;
            top: 10px;
            right: 75px;
            z-index: 1000;
            display: none; /* Initially hidden */
            width: 300px;
            height: 400px;
        }

        /* Added CSS for zoomable effect */
        .zoomable {
            transition: transform 0.2s; /* Smooth zoom effect */
        }

        .zoomable:hover {
            transform: scale(1.5); /* Zoom level (1.5x) */
            cursor: zoom-in; /* Change cursor to indicate zoom */
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <input type="text" id="lat" placeholder="Latitude">
    <input type="text" id="lng" placeholder="Longitude">
    <button onclick="updateMarker()">Update Map</button>

    <div>
        <input type="checkbox" id="toggleGeology" onclick="toggleLayer(this, wmsGeologyLayer)">
        <label for="toggleGeology" style="color: white;">Surface Geology</label>
    </div>
    <div>
        <input type="checkbox" id="toggleMines" onclick="toggleLayer(this, wmsMinesLayer)">
        <label for="toggleMines" style="color: white;">Mines</label>
    </div>
    <div>
        <input type="checkbox" id="toggleHydroMap" onclick="toggleLayer(this, wmsHydroLayer)">
        <label for="toggleHydroMap" style="color: white;">Hydrogeological Map</label>
    </div>
    <div id="info" style="color: white;">Click on a layer to get more information.</div>

    <!-- Added zoomable class to both legends -->
    <img id="geologyLegend" class="legend zoomable" src="geology_legend.svg" alt="Geology Legend">
    <img id="hydroLegend" class="legend zoomable" src="hydro_legend.svg" alt="Hydrogeological Legend">

    <script>
        // Initialize the map
        var map = L.map('map').setView([53.3439, 23.0622], 4);
    
        // Tile Layer for base map
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
        }).addTo(map);
    
        // Define WMS layers for geology, mines, and hydrogeology
        var wmsGeologyLayer = L.tileLayer.wms('https://geoserver.geo-zs.si/egdi-surface-geology/gsmlp/wms', {
            layers: 'gsmlp:GeologicUnitView_Lithology',
            format: 'image/png',
            transparent: true,
            version: '1.3.0'
        });
    
        var wmsMinesLayer = L.tileLayer.wms('https://data.geus.dk/egdi/wms/', {
            layers: 'egdi_mines',
            format: 'image/png',
            transparent: true,
            version: '1.1.1'
        });
    
        var wmsHydroLayer = L.tileLayer.wms('https://services.bgr.de/wms/grundwasser/ihme1500/', {
            layers: '0,1,2',
            format: 'image/png',
            transparent: true,
            version: '1.3.0'
        });
    
        var clickMarker = null; // Marker reference
    
        // Layer toggle function for checkbox clicks
        function toggleLayer(checkbox, layer) {
            if (checkbox.checked) {
                layer.addTo(map);
                if (layer === wmsGeologyLayer) {
                    document.getElementById('geologyLegend').style.display = 'block';
                } else if (layer === wmsHydroLayer) {
                    document.getElementById('hydroLegend').style.display = 'block';
                }
            } else {
                map.removeLayer(layer);
                if (layer === wmsGeologyLayer) {
                    document.getElementById('geologyLegend').style.display = 'none';
                } else if (layer === wmsHydroLayer) {
                    document.getElementById('hydroLegend').style.display = 'none';
                }
            }
        }
    
        // Function to update marker position
        function setMarker(lat, lng) {
            if (clickMarker) {
                clickMarker.setLatLng([lat, lng]);
            } else {
                clickMarker = L.marker([lat, lng]).addTo(map);
            }
    
            map.setView([lat, lng], map.getZoom());
            document.getElementById('lat').value = lat.toFixed(5);
            document.getElementById('lng').value = lng.toFixed(5);
            sendLocation(lat, lng);
        }
    
        // Function to send location to pywebview
        function sendLocation(lat, lng) {
            if (window.pywebview && window.pywebview.api) {
                console.log("Sending coordinates to pywebview:", lat, lng); // Debugging
                window.pywebview.api.send_coordinates(lat, lng);
            } else {
                console.warn("PyWebView API not ready. Skipping coordinate send.");
            }
        }
    
        // Event listener to handle map click and set marker
        map.on('click', function(e) {
            console.log("Map clicked at:", e.latlng); // Debugging
            setMarker(e.latlng.lat, e.latlng.lng);
        });
    
        // Function to update marker from input box
        function updateMarker() {
            var lat = parseFloat(document.getElementById('lat').value);
            var lng = parseFloat(document.getElementById('lng').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                setMarker(lat, lng);
            } else {
                alert('Please enter valid latitude and longitude.');
            }
        }
    
        // Ensure the pywebview API is injected immediately
        document.addEventListener("pywebviewready", function() {
            console.log("PyWebView API is ready! Now clicks will send coordinates.");
            // Initialize layers (even if not toggled, they are added at the start)
            document.getElementById("toggleGeology").checked = true;
            toggleLayer(document.getElementById("toggleGeology"), wmsGeologyLayer);
            document.getElementById("toggleHydroMap").checked = true;
            toggleLayer(document.getElementById("toggleHydroMap"), wmsHydroLayer);
        });
    
        // Initialize the map and layers as soon as possible (on page load)
        document.addEventListener("DOMContentLoaded", function() {
            console.log("Webview is ready, map and layers are set up.");
            // Optionally initialize more layers or logic here if needed
        });
    
    </script>
</body>
</html>
