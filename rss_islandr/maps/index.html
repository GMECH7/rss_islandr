<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geology Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>
    <button id="togglePanelBtn" class="toggle-btn">☰</button>

    <div id="controlsPanel" class="controls">
        <div class="coordinates">
            <input type="text" id="lat" placeholder="Latitude">
            <input type="text" id="lng" placeholder="Longitude">
        </div>
        

        <!-- Geological maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Geological maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label for="toggleGeology">Europe<input type="checkbox" id="toggleGeology"></label>
                <label for="toggleGeologyBGR">International Geological Map of Europe and the Mediteranean Regions 1:1,500,000<input type="checkbox" id="toggleGeologyBGR"></label>
                <label for="toggleGeologyIGE2500BGR">International Quaternary Map of Europe 1:2,500,000<input type="checkbox" id="toggleGeologyIGE2500BGR"></label>
            </div>
        </div>
        
        <!-- Minerals maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Minerals maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label>Europe<input type="checkbox" id="toggleMines"></label>
            </div>
        </div>
        
        <!-- Hydrogeological maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Hydrogeological maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label for="toggleHydroEurope">International Hydrogeological Map of Europe 1:1,500,000<input type="checkbox" id="toggleHydroEurope"></label>
                <label for="toggleHydroGlobal">Groundwater Resources of the World<input type="checkbox" id="toggleHydroGlobal"></label>
            </div>
        </div>
        
        <!-- Soil maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Soil maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label for="toggleSoilEurope">Soil Regions of the European Union and Adjacent Countries 1:5,000,000<input type="checkbox" id="toggleSoilEurope"></label>
            </div>
        </div>
        
        <!-- Hydrological maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Hydrological maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label for="toggleRiverNetwork">EU hydro river network<input type="checkbox" id="toggleRiverNetwork"></label>
                
            </div>
        </div>
    </div>

    <!-- Legends -->

    <div id="GeologyLegend" class="legend">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <img id="GeologyLegend" class="legend zoomable" src="geology_legend.svg" alt="Geology Legend">
    </div>
    
    <div id="GeologyBGRLegend" class="legend">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="bgr_geology_europe_legend.html"></object>
    </div>

    <div id="GeologyIGE2500BGRLegend" class="legend">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="bgr_geology_quaternary_legend.html"></object>
    </div>

    <div id="MinesLegend" class="legend">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="mines_legend.html"></object>
    </div>

    <div id="HydroEuropeLegend" class="legend">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="bgr_hydro_europe_legend.html"></object>
    </div>

    <div id="HydroGlobalLegend" class="legend">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="bgr_hydro_global_legend.html"></object>
    </div>

    <div id="SoilEuropeLegend" class="legend">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="bgr_soil_legend.html"></object>
    </div>


    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
