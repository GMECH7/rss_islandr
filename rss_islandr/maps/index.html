<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geology Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>
    <button id="togglePanelBtn" class="toggle-btn">☰</button>

    <div id="controlsPanel" class="controls">
        <div class="coordinates">
            <input type="text" id="lat" placeholder="Latitude">
            <input type="text" id="lng" placeholder="Longitude">
        </div>
        

        <!-- Geological maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Geological maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label>Europe <input type="checkbox" id="toggleGeology"></label>
            </div>
        </div>
        
        <!-- Minerals maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Minerals maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label>Europe<input type="checkbox" id="toggleMines"></label>
            </div>
        </div>
        
        <!-- Hydrogeological maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Hydrogeological maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label for="toggleHydroEurope">Europe<input type="checkbox" id="toggleHydroEurope"></label>
                <label for="toggleHydroGlobal">Global<input type="checkbox" id="toggleHydroGlobal"></label>
            </div>
        </div>
        
        <!-- Soil maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Soil maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label for="toggleSoilEurope">Europe<input type="checkbox" id="toggleSoilEurope"></label>
            </div>
        </div>
        
        <!-- Hydrological maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Hydrological maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label for="toggleRiverNetwork">EU hydro river network<input type="checkbox" id="toggleRiverNetwork"></label>
                
            </div>
        </div>
    </div>

    <!-- Legends -->
    <img id="GeologyLegend" class="legend zoomable" src="geology_legend.svg" alt="Geology Legend">
    <div id="MinesLegend" class="legend">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <div class="legend-content">
            <object type="text/html" data="mines_legend.html"></object>
        </div>
    </div>

    <div id="HydroEuropeLegend" class="legend">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="bgr_hydro_europe_legend.html"></object>
    </div>

    <div id="HydroGlobalLegend" class="legend">
        <object type="text/html" data="bgr_hydro_global_legend.html"></object>
    </div>
    <div id="SoilEuropeLegend" class="legend">
        <object type="text/html" data="bgr_soil_legend.html"></object>
    </div>
    <!-- <div id="SoilEuropeLegend" class="legend" style="background: rgba(255, 255, 255, 0.5); padding: 10px;">
        <object type="text/html" data="bgr_soil_legend.html" style="width:20%; height:100%; border:none;"></object>
    </div> -->

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
