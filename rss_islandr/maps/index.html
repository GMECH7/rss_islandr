<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Leaflet maps</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,"> <!-- Supress favicon error -->
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/leaflet_draw.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="map"></div>
    <button id="togglePanelBtn" class="toggle-btn">☰</button>

    <div id="controlsPanel" class="controls">
        <div class="drawing-controls">
            <button id="drawSourceBtn" class="draw-btn" style="background-color: #8B0000; color: white;">
                <i class="fas fa-industry"></i> Draw Source
            </button>
            <button id="drawPathwayBtn" class="draw-btn" style="background-color: #ccccff;">
                <i class="fas fa-random"></i> Draw Pathway
            </button>
            <button id="drawReceptorBtn" class="draw-btn" style="background-color: #ccffcc;">
                <i class="fas fa-city"></i> Draw Receptor
            </button>
            <button id="clearDrawingsBtn" class="draw-btn">
                <i class="fas fa-trash-alt"></i> Clear All Drawings
            </button>
        </div>
        <div class="coordinates">
            <div class="coordinates-input-group">
                <input type="text" id="lat" placeholder="Latitude (e.g., 53.3439 or 40°26'46&quot;N)">
                <input type="text" id="lng" placeholder="Longitude (e.g., 23.0622 or 79°58'56&quot;W)">
            </div>
            <button id="updateMarkerBtn" class="coordinates-button">Update Marker</button>
        </div>


        <!-- Geological maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Geological maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label for="toggleGeologyGeoZS">Surface Geologic Units Lithology<input type="checkbox"
                        id="toggleGeologyGeoZS"></label>
                <label for="toggleGeologyIGME5000BGR">International Geological Map of Europe and Adjacent
                    Areas 1:5,000,000<input type="checkbox" id="toggleGeologyIGME5000BGR"></label>
            </div>
        </div>

        <!-- Minerals maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Minerals resources maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label>Mines of Europe<input type="checkbox" id="toggleMines"></label>
            </div>
        </div>

        <!-- Hydrogeological maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Hydrogeological maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label for="toggleHydroEurope">International Hydrogeological Map of Europe 1:1,500,000<input
                        type="checkbox" id="toggleHydroEurope"></label>
                <label for="toggleHydroGlobal">Groundwater Resources of the World<input type="checkbox"
                        id="toggleHydroGlobal"></label>
                <label for="toggleBGRNorm">Natural Radionuclides in Groundwater<input type="checkbox"
                        id="toggleBGRNorm"></label>
                <label for="toggleBGRrgwb">River and Groundwater Basins of the World<input type="checkbox"
                        id="toggleBGRrgwb"></label>
                <label for="toggleBGRwokam">World Karst Aquifer Map<input type="checkbox" id="toggleBGRwokam"></label>
            </div>
        </div>

        <!-- Soil maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Soil maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label for="toggleSoilEurope">Soil Regions of the European Union and Adjacent Countries
                    1:5,000,000<input type="checkbox" id="toggleSoilEurope"></label>
            </div>
        </div>

        <!-- Hydrological maps -->
        <div class="map-group">
            <div class="map-group-header">
                <span>Hydrological maps</span>
                <span class="toggle-icon">+</span>
            </div>
            <div class="map-group-content">
                <label for="toggleRiverNetwork">EU hydro river network<input type="checkbox"
                        id="toggleRiverNetwork"></label>
            </div>
        </div>
    </div>

    <!-- Legends -->
    <div id="GeologyGeoZSLegend" class="legend-container">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="legends/geozs_legend.html"></object>
    </div>

    <div id="GeologyIGME5000BGRLegend" class="legend-container">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="legends/bgr_igme5000_legend.html"></object>
    </div>

    <div id="MinesLegend" class="legend-container">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="legends/mines_legend.html"></object>
    </div>

    <div id="HydroEuropeLegend" class="legend-container">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="legends/bgr_hydro_europe_legend.html"></object>
    </div>

    <div id="BGRNormLegend" class="legend-container">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="legends/bgr_norm_legend.html"></object>
    </div>

    <div id="BGRrgwbLegend" class="legend-container">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="legends/bgr_rgwb_legend.html"></object>
    </div>

    <div id="BGRwokamLegend" class="legend-container">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="legends/bgr_wokam_legend.html"></object>
    </div>

    <div id="HydroGlobalLegend" class="legend-container">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="legends/bgr_hydro_global_legend.html"></object>
    </div>

    <div id="SoilEuropeLegend" class="legend-container">
        <button class="minimize-btn" onclick="toggleLegend(this)">–</button>
        <object type="text/html" data="legends/bgr_soil_legend.html"></object>
    </div>


    <button id="captureScreenBtn" class="screenshot-btn" title="Save">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
            <path
                d="M17,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V7L17,3M12,19A2.5,2.5 0 1,1 14.5,16.5A2.5,2.5 0 0,1 12,19M6,8V5H15V8H6Z" />
        </svg>
    </button>
    <script src="js/leaflet.js"></script>
    <script src="js/leaflet_draw.js"></script>
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
    <canvas id="screenshotCanvas" style="display:none;"></canvas>
</body>

</html>
