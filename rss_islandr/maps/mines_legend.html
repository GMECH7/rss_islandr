    <script type="text/javascript">
        // some javascript to customize the styling a bit more
        var lang = 'da';
        var hasClassItem = 'true';
        document.body.style.margin = "0px" 
        var scale = 8650352.994084345; // Replaced by actual value or -1 by legend.jsp: this is the scale that mapserver can calculate from the given extent and size of the image
        var availableLegendClasses = ['Closed','Open','Under development']; // Replaced by available legendclasses or empty string by legend.jsp:  this is a list of names of legend classes
        var nrofLegendClasses = ['46365','12299','1119']; // Replaced by available legendclasses or empty string by legend.jsp: contains results of a count(*) for each symbol class
        var connectiontype = 'postgis';
        var groups_grouped = 'false';
        var showAll = 'false';
        if (connectiontype === 'wfs'){
                availableLegendClasses = Array.of(...new Set(Array.of(...document.getElementsByTagName("figure")).map(o => o.dataset.classname)));
                nrofLegendClasses = [];
        }
        // get all legend classes that mapscript has generated
        var legend_items = document.getElementsByClassName("legend_item");
        var items = Array.from(legend_items);
        
        var valueText =  lang === 'da' ? ')</span>' :  ")</span>";
        var totalText =  lang === 'da' ? "Total antal" : "Total number";
        var helptext =  lang === 'da' ? "Mouse over til at få flere oplysninger omkring symboler " : "Mouse over the symbols to get more information";
        
        function scaleFilter(o){
            if(scale > Number(o.dataset.minscale) && scale < Number(o.dataset.maxscale)){
                return true;
            }
            else if(Number(o.dataset.minscale) === -1 && Number(o.dataset.maxscale) === -1 ){
                return true;
            }
            else if(scale > Number(o.dataset.minscale) && Number(o.dataset.maxscale) === -1 ){
                return true;
            }
            else if(scale < Number(o.dataset.maxscale) && Number(o.dataset.minscale) === -1 ){
                return true;
            }
            else {
                false;
            }
        }
        
        // set all the legend classes that are within scale and included in the result set of the attribute filtering and extent search to be displayed
        // also adds the count values from the nrofLegendClasses array.
        if (hasClassItem === 'true'){
        items.filter(scaleFilter)
             .filter(o => availableLegendClasses.indexOf(o.dataset.classname) > -1 )
             .map((o,i) => {o.style.display = 'table'; o.dataset.availableLegendClasses = nrofLegendClasses[availableLegendClasses.indexOf(o.dataset.classname)]; });
        }
        else {
            items
             .map((o,i) => {o.style.display = 'table'; maindiv.appendChild(o);});
        }
        // get all the distinct group headers (all text before ' - ' text
        var headers = [...new Set(items.filter(o => o.dataset.classname.indexOf(" - ") > -1)
        .filter(o => availableLegendClasses.indexOf(o.dataset.classname) > -1 )
        .map(o => o.dataset.classname.split(" - ")[0]))];
        
        if (groups_grouped === 'true' && headers.length > 0){
             var top_comments = document.getElementById("top_comments");
             top_comments.innerText = 	helptext;
             }
        
        
        // add a h2 element before each first figure which includes the group name
        // removes the group name from each item.
        headers.map(h => { 
             var div1 = items.filter(o => o.dataset.classname.indexOf(h) > -1)[0];
             
             var h2 = document.createElement("h2");
             var divclear = document.createElement("div");
             var headerText = h;
             if (h.length > 2){
                 headerText = h.charAt(0).toUpperCase()+h.substring(1);
             }
             
             h2.innerHTML = headerText;
             h2.style.fontFamily = '"Helvetica Neue", Helvetica, Arial, sans-serif';
             h2.style.fontSize = '13px';
             h2.style.fontWeight = "bold";
             maindiv.style.columns = "20em auto";
             h2.style.marginTop = "0px";
             h2.style.marginBottom = "0px";
             h2.style.padding= "3px 0px 1px 0px";
             //document.body.insertBefore(divclear, div1);
             document.body.insertBefore(h2, div1);
             if (groups_grouped === 'true'){
             //h2.style.float = "left";
                h2.style.fontWeight = "normal";
                h2.style.width = "100px";
                var divgroup = document.createElement("div");
                divgroup.style.display = "table";
                divgroup.classList.add("divgroup");
                divclear.after(divgroup);
                divgroup.appendChild(h2);
                maindiv.appendChild(divgroup);
                h2.style.display = "table-cell";
                divclear.style.clear = "both";
                divclear.style.height = "3px";
             }
             else {
                maindiv.appendChild(h2);
                
             
             }
    
             items.filter(o => o.dataset.classname.indexOf(h) > -1)
                   .map(o => {
                        var nr_records = o.dataset.availableLegendClasses === undefined ? 0 : o.dataset.availableLegendClasses;
                        if (groups_grouped === 'true'){
                        if (nr_records > 0 || showAll === "true"){
                        o.style.display = "table-cell";
                        
                        divgroup.appendChild(o);
                        }
                        
    
                            var figcaption = o.getElementsByTagName("figcaption")[0];
                        figcaption.innerText = figcaption.innerText.split(h+" - ")[1];
                        figcaption.style.display = 'none';
                        var image = o.getElementsByTagName("img")[0];
                        //o.style.float = 'left';
                        o.style.marginRight = '0px';
                        o.style.marginBottom = '0px';
                         image.style.marginRight = '0px';
                        image.title = image.title + " - "+nr_records + " records";
                        
                        
                        
                        figcaption.innerHTML = figcaption.dataset.title.length > 0 ? figcaption.dataset.title : "<span style='font-style:italic;font-size:12px;'> ("+ nr_records+ valueText;
                        }
                        else {
                        if (nr_records > 0 || showAll === "true"){
                        maindiv.appendChild(o);
                        o.style.display = "table";
                        var figcaption = o.getElementsByTagName("figcaption")[0];
                        figcaption.style.display = "table-cell";
                        figcaption.innerText = figcaption.innerText.split(h+" - ")[1];
                        figcaption.innerHTML = figcaption.dataset.title.length > 0 ? figcaption.dataset.title : figcaption.innerHTML + "<span style='font-style:italic;font-size:12px;'> ("+ nr_records + valueText; 
                        }
                        }}
                        );
                    });
        
        if(headers.length === 0 ){
            Array.of(...document.getElementsByTagName("figcaption")).map(figcaption => {
                figcaption.innerHTML = figcaption.dataset.title.length > 0 ? figcaption.dataset.title : figcaption.innerHTML;
                
                if( connectiontype !== 'wfs' && hasClassItem === 'true'){
                    figcaption.innerHTML = figcaption.innerHTML + "<span style='font-style:italic;font-size:12px;'> ("+ figcaption.parentElement.dataset.availableLegendClasses + valueText ;
                }
            }
            )
        }
        
        var total_records = Array.of(...document.getElementsByTagName("figure")).filter(o => o.style.display !== 'none').filter(o => o.dataset.availableLegendClasses !== undefined).map(o => Number(o.dataset.availableLegendClasses)).reduce((p,a) => p + a, 0)
        var p = document.getElementById("layer_text");
        p.style.clear = "both";
        //var l = document.getElementById("layer_meta");
        if (connectiontype !== 'wfs' && hasClassItem === 'true'){
        p.innerHTML = totalText +": " + "<i>" + total_records +"</i>";
        }
        else {
        p.innerHTML = "";
        }
        document.body.appendChild(p);
        //document.body.appendChild(l);
        if (headers.length > 0 && groups_grouped === 'true'){
            //Array.from(document.getElementsByClassName("legend_item")).map(o => {o.style.float = "left"});
        }
        if (showAll === 'true' && groups_grouped === "true"){
            Array.from(document.getElementsByClassName("legend_item")).map(o => {o.style.display = 'table-cell'});
        }
        
        if (showAll === 'true' && groups_grouped === "false"){
            Array.from(document.getElementsByClassName("legend_item")).map(o => {o.style.display = 'table'});
        }
        
        
    </script><p id="layer_text" style="font-family: &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; font-size: 13px; padding-top: 10px; clear: both;">Total antal: <i>59783</i></p>
