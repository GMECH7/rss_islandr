[tool.poetry]
name = "rss_islandr"
version = "1.16.0"
description = "Risk Screening System developed for CERTH under the ISLANDR project"
authors = ["Georgios Makris <giorgos.p.makris@gmail.com>"]
readme = "README.md"

# Custom tool section for release version
[tool.islandr]
release_version = "1.3.0" # Release version for clients

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
ttkbootstrap = "^1.12.0"
xlwings = "^0.33.12"
pywebview = "^5.4"
pyinstaller = "^6.13.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
