[tool.poetry]
name = "rss_islandr"
version = "2.0.0"
description = "Risk Screening System developed for CERTH under the ISLANDR project"
authors = ["Georgios Makris <giorgos.p.makris@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [
    { include = "rss_islandr" },
    { include = "dev_scripts" },
    { include = "build_installer" },
]

[tool.poetry.scripts]
islandr = "dev_scripts.run:main"
clean = "dev_scripts.clean:main"
rss-build = "build_installer.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
rich = "^14.0.0"      # Console output of the build scripts
pypdf = "^6.19.0"
ruff = "^0.16.8"

[tool.poetry.group.build.dependencies]
pyinstaller = "^6.13.0"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
ttkbootstrap = "^1.12.0"
pywebview = [
    { version = "^5.4", extras = [
        "winforms",
    ], markers = "sys_platform == 'win32'" },
    { version = "^5.4", extras = [
        "qt",
    ], markers = "sys_platform != 'win32'" },
]
qtpy = { version = "^2.4", markers = "sys_platform != 'win32'" } # Qt backend of pywebview (Linux/macOS)
reportlab = "^4.4.1"
openpyxl = "^3.1.5"

[tool.ruff]
line-length = 120
exclude = ["**/__pycache__"]

[tool.ruff.lint]
# select = ["E", "F", "I"]
ignore = ["D419"] # Empty docstrings

[tool.pytest.ini_options]
pythonpath = ["rss_islandr", "tests"]
addopts = """
    --cov=rss_islandr
    --cov-report=lcov:.cov_files/lcov.info 
    --cov-report=xml:.cov_files/coverage.xml
    --cov-report=html:.cov_files/html
    --cov-report=term
    --cov-branch
"""

[tool.coverage.run]
data_file = ".cov_files/.coverage" # Redirect .coverage file here
source = ["rss_islandr"] # Only measure coverage here
omit = [
    "tests/*",           # Ignore test files
    "main.py",           # Ignore main entry point
    "build_installer/*", # Ignore the installer build scripts
    "dev_scripts/*",     # Ignore the development scripts
    "*/__init__.py",
]


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
