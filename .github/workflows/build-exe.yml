name: Build EXE

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller toml poetry
          poetry install

      - name: Generate version info
        run: |
          python generate_version.py
          cat version_info.txt  # Debug output

      - name: Build EXE
        run: |
          pyinstaller --name=islandr --onefile --clean `
                     --icon=rss_islandr/static/islandr.ico `
                     --version-file=version_info.txt `
                     ./main/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: islandr-exe
          path: dist/islandr.exe
