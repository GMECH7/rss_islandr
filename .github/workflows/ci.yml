name: Tests

# Runs the tests on Linux and Windows on pull requests to main (before the merge), on pushes to main and with the
# "Run workflow" button.
on:
  push:
    branches:
      - main
      # - makge/publication # Temporary: to try the tests on this branch, remove the "#"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.1"

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry and the dependencies
        run: |
          pip install poetry==${{ env.POETRY_VERSION }}
          poetry install --with dev

      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libtk8.6

      - name: Run the tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a poetry run pytest

      - name: Run the tests (Windows)
        if: runner.os == 'Windows'
        run: poetry run pytest
